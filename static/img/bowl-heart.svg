<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 饭碗儿主视觉 V2：奶油白瓷碗 · 金棕描边 · 金色小心心（详情页用，透明背景） -->
  <defs>
    <linearGradient id="bh-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.55" stop-color="#faf1dc"/>
      <stop offset="1" stop-color="#f0e2c0"/>
    </linearGradient>
    <linearGradient id="bh-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3e7c8"/>
    </linearGradient>
  </defs>

  <!-- 碗足 -->
  <ellipse cx="120" cy="221" rx="36" ry="7.5" fill="#f0e2c0" stroke="#b98d4f" stroke-width="3"/>

  <!-- 碗身：奶油白瓷 + 金棕描边 -->
  <path d="M34 156 Q120 216 206 156 L194 196 Q120 240 46 196 Z"
        fill="url(#bh-body)" stroke="#b98d4f" stroke-width="5" stroke-linejoin="round"/>
  <!-- 碗身右侧体积阴影 -->
  <path d="M150 172 Q180 178 190 196 Q164 210 136 206 Q150 190 150 172 Z" fill="#ecdcb4" opacity="0.75"/>
  <!-- 碗身左侧高光 -->
  <path d="M58 176 Q70 196 92 206 Q74 208 62 198 Q56 186 58 176 Z" fill="#ffffff" opacity="0.55"/>

  <!-- 碗口（几何与旧版一致，动态米粒坐标依赖此碗口位置） -->
  <ellipse cx="120" cy="150" rx="86" ry="34" fill="url(#bh-rim)" stroke="#b98d4f" stroke-width="4.5"/>
  <!-- 碗内壁深度 -->
  <ellipse cx="120" cy="150" rx="76" ry="27" fill="none" stroke="#e6d4a8" stroke-width="7" opacity="0.5"/>

  <!-- 底部少量米：空碗阶段的最小说明，动态米粒会随进度盖上来 -->
  <g fill="#fdf8ec" stroke="#ead9b8" stroke-width="1.2">
    <ellipse cx="88" cy="161" rx="19" ry="8.5"/>
    <ellipse cx="122" cy="157" rx="20" ry="9.5"/>
    <ellipse cx="156" cy="161" rx="19" ry="8.5"/>
    <ellipse cx="105" cy="166" rx="17" ry="7.5" fill="#fffdf4"/>
    <ellipse cx="140" cy="166" rx="17" ry="7.5" fill="#fffdf4"/>
  </g>

  <!-- 金色小心心（碗身正面） -->
  <path d="M120 213 c-7.5 -5.8 -13.5 -10 -13.5 -16.2 c0 -4.6 3.6 -8.3 8.1 -8.3 c2.3 0 4.3 1.1 5.4 2.8 c1.1 -1.7 3.1 -2.8 5.4 -2.8 c4.5 0 8.1 3.7 8.1 8.3 c0 6.2 -6 10.4 -13.5 16.2 z"
        fill="#e8a33d" stroke="#c9891f" stroke-width="2" stroke-linejoin="round"/>
</svg>
