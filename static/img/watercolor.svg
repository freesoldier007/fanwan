<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" preserveAspectRatio="xMidYMax slice">
  <!-- 江南水墨远山：极淡暖色装饰（透明背景，不压文字） -->
  <defs>
    <linearGradient id="wc-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c39a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d9c39a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wc-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wc-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98d4f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#b98d4f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 远山 -->
  <path d="M0 250 Q120 170 240 235 Q330 280 420 232 Q520 180 640 238 Q760 292 880 234 Q990 184 1080 232 Q1140 258 1200 240 L1200 320 L0 320 Z" fill="url(#wc-a)"/>
