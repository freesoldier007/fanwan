  <!-- 近景丘 -->
  <path d="M0 300 Q160 252 320 292 Q520 336 720 296 Q900 262 1040 300 Q1120 318 1200 302 L1200 320 L0 320 Z" fill="url(#wc-c)"/>
  <!-- 淡墨晕染 -->
