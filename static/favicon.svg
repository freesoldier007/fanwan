<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 饭碗儿 V1.2 favicon：品牌碗标识 + 奶油底色圆角方块 -->
  <defs>
    <linearGradient id="fv-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f0e2c0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="22" fill="#fbf4e4"/>

  <!-- 碗足 -->
  <ellipse cx="48" cy="82" rx="14" ry="4" fill="#f0e2c0" stroke="#b98d4f" stroke-width="2"/>

  <!-- 碗身 -->
  <path d="M10 50 Q48 78 86 50 L79 72 Q48 88 17 72 Z"
        fill="url(#fv-body)" stroke="#b98d4f" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M62 58 Q74 60 78 68 Q68 74 56 72 Q63 65 62 58 Z" fill="#ecdcb4" opacity="0.7"/>
  <path d="M22 60 Q30 70 40 74 Q30 74 24 69 Q21 64 22 60 Z" fill="#ffffff" opacity="0.5"/>

  <!-- 碗口 -->
  <ellipse cx="48" cy="50" rx="38" ry="13" fill="#fffdf6" stroke="#b98d4f" stroke-width="2.8"/>
  <ellipse cx="48" cy="50" rx="32" ry="9.5" fill="none" stroke="#e6d4a8" stroke-width="4" opacity="0.5"/>

  <!-- 白米饭 -->
  <g fill="#fffdf8" stroke="#e8dcc2" stroke-width="1">
    <ellipse cx="32" cy="47" rx="9" ry="5"/>
    <ellipse cx="48" cy="44" rx="10" ry="5.5"/>
    <ellipse cx="64" cy="47" rx="9" ry="5"/>
    <ellipse cx="40" cy="51" rx="8" ry="4.5" fill="#fffdf4"/>
    <ellipse cx="57" cy="51" rx="8" ry="4.5" fill="#fffdf4"/>
  </g>

  <!-- 金色小心心 -->
  <path d="M48 72.5 c-3.4 -2.6 -6.1 -4.5 -6.1 -7.3 c0 -2.1 1.6 -3.8 3.7 -3.8 c1 0 2 0.5 2.4 1.3 c0.5 -0.8 1.4 -1.3 2.4 -1.3 c2.1 0 3.7 1.7 3.7 3.8 c0 2.8 -2.7 4.7 -6.1 7.3 z"
        fill="#e8a33d" stroke="#c9891f" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
